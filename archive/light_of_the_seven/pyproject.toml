[project]
name = "light-of-the-seven"
dynamic = ["version"]
description = "An educational journey through computational understanding from theory to hardware"
authors = [
    {name = "Irfan Kabir", email = "irfankabir02@gmail.com"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "acoustics>=0.2.6",
    "chromadb>=0.5.0",
    "scipy>=1.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.0.291",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]
ibm = [
    "ibm-watsonx-ai>=1.0.0",
    "ibm-watson>=7.0.0",
]
cuda = [
    "cupy-cuda11x>=12.0.0; platform_system!='Darwin'",
]
temporal = [
    "cryptography>=42.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.291",
    "isort>=5.0.0",
]

# UV dependency groups (align with GRID-main / echoes: uv sync --group dev --group test)
[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.0.291",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
light-of-seven = "light_of_the_seven.integration:print_welcome_message"
lo7-manifest = "light_of_the_seven.lo7.cli:main_manifest"
lo7-heatmap = "light_of_the_seven.lo7.cli:main_heatmap"

[project.urls]
Homepage = "https://github.com/irfankabir02/light_of_the_seven"
Documentation = "https://github.com/irfankabir02/light_of_the_seven#readme"
Repository = "https://github.com/irfankabir02/light_of_the_seven"
Issues = "https://github.com/irfankabir02/light_of_the_seven/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/light_of_the_seven/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/light_of_the_seven"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/archives",
    "/SEGA",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "asyncio: async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

# Long CLI / colored output lines in the Git helper
[tool.ruff.lint.per-file-ignores]
"scripts/git_manager.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
