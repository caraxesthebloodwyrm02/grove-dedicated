<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interactive Circle of Fifths</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
                background-color: #f9f9f9;
            }
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .title {
                font-size: 24px;
                margin-bottom: 20px;
                color: #333;
            }
            .subtitle {
                font-size: 16px;
                margin-bottom: 30px;
                color: #666;
                text-align: center;
            }
            .controls {
                margin-bottom: 20px;
                display: flex;
                gap: 10px;
            }
            button {
                padding: 8px 16px;
                background-color: #4caf50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            }
            button:hover {
                background-color: #45a049;
            }
            .tooltip {
                position: absolute;
                padding: 8px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                border-radius: 4px;
                pointer-events: none;
                font-size: 14px;
            }
            .node text {
                font-size: 12px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="title">Interactive Circle of Fifths</div>
            <div class="subtitle">
                Explore the Circle of Fifths as a computational framework.<br />
                Hover over keys to see details. Click to highlight transitions.
            </div>
            <div class="controls">
                <button id="highlight-fifths">Highlight Perfect Fifths</button>
                <button id="reset">Reset</button>
            </div>
            <svg id="circle-of-fifths" width="600" height="600"></svg>
            <div class="tooltip" id="tooltip"></div>
        </div>

        <script>
            // Define the Circle of Fifths keys
            const keys = [
                "C",
                "G",
                "D",
                "A",
                "E",
                "B",
                "F#",
                "C#",
                "G#",
                "D#",
                "A#",
                "F",
            ];

            // Set up the SVG
            const svg = d3.select("#circle-of-fifths");
            const width = +svg.attr("width");
            const height = +svg.attr("height");
            const radius = Math.min(width, height) / 2 - 40;

            // Create a group for the visualization
            const g = svg
                .append("g")
                .attr("transform", `translate(${width / 2}, ${height / 2})`);

            // Draw the circle
            g.append("circle")
                .attr("r", radius)
                .attr("fill", "none")
                .attr("stroke", "#ccc")
                .attr("stroke-width", 1);

            // Create nodes for each key
            const nodes = g
                .selectAll(".node")
                .data(keys)
                .enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", (d, i) => {
                    const angle = (i * 2 * Math.PI) / keys.length - Math.PI / 2;
                    return `translate(${radius * Math.cos(angle)}, ${radius * Math.sin(angle)})`;
                })
                .on("mouseover", function (event, d) {
                    const tooltip = d3.select("#tooltip");
                    tooltip
                        .style("visibility", "visible")
                        .text(`Key: ${d}`)
                        .style("left", `${event.pageX + 10}px`)
                        .style("top", `${event.pageY + 10}px`);
                })
                .on("mouseout", function () {
                    d3.select("#tooltip").style("visibility", "hidden");
                })
                .on("click", function (event, d) {
                    highlightTransitions(d);
                });

            // Add circles for each node
            nodes
                .append("circle")
                .attr("r", 20)
                .attr("fill", "lightblue")
                .attr("stroke", "#333")
                .attr("stroke-width", 1);

            // Add text labels for each node
            nodes
                .append("text")
                .text((d) => d)
                .attr("text-anchor", "middle")
                .attr("dy", "0.3em")
                .attr("fill", "#333");

            // Draw transitions (perfect fifths)
            for (let i = 0; i < keys.length; i++) {
                const startAngle =
                    (i * 2 * Math.PI) / keys.length - Math.PI / 2;
                const endAngle =
                    (((i + 1) % keys.length) * 2 * Math.PI) / keys.length -
                    Math.PI / 2;

                g.append("path")
                    .attr(
                        "d",
                        d3
                            .arc()
                            .innerRadius(radius - 20)
                            .outerRadius(radius - 20)
                            .startAngle(startAngle)
                            .endAngle(endAngle),
                    )
                    .attr("fill", "none")
                    .attr("stroke", "#ccc")
                    .attr("stroke-width", 1)
                    .attr("class", "transition")
                    .attr(
                        "id",
                        `transition-${keys[i]}-${keys[(i + 1) % keys.length]}`,
                    );
            }

            // Highlight transitions from a selected key
            function highlightTransitions(key) {
                d3.selectAll(".transition").attr("stroke", "#ccc");

                const index = keys.indexOf(key);
                const nextKey = keys[(index + 1) % keys.length];
                const prevKey = keys[(index - 1 + keys.length) % keys.length];

                d3.select(`#transition-${key}-${nextKey}`).attr(
                    "stroke",
                    "#4CAF50",
                );
                d3.select(`#transition-${prevKey}-${key}`).attr(
                    "stroke",
                    "#4CAF50",
                );
            }

            // Highlight all perfect fifths
            d3.select("#highlight-fifths").on("click", function () {
                d3.selectAll(".transition").attr("stroke", "#4CAF50");
            });

            // Reset the visualization
            d3.select("#reset").on("click", function () {
                d3.selectAll(".transition").attr("stroke", "#ccc");
            });
        </script>
    </body>
</html>
