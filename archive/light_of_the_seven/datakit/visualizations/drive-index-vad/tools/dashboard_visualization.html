<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID Focused Work Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap');

        :root {
            --bg: #05050a;
            --accent-cyan: #00f2fe;
            --accent-purple: #7b2cbf;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 20px rgba(0, 242, 254, 0.3);

            /* Values from focused work state */
            --val-v: 0.39;
            --val-a: 0.74;
            --val-d: 0.36;
            --val-drive: 0.104;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(123, 44, 191, 0.05) 0%, transparent 40%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cockpit {
            position: relative;
            width: 1000px;
            height: 600px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
        }

        .header {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: var(--neon-glow);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.4;
            }
        }

        /* Left Side: Dials */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
        }

        .dial-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .dial {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .dial svg {
            transform: rotate(-90deg);
        }

        .dial .bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 4;
        }

        .dial .progress {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 226;
            /* 2 * PI * 36 */
            transition: stroke-dashoffset 1s ease-out;
        }

        .dial-label {
            display: flex;
            flex-direction: column;
        }

        .dial-label .name {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
        }

        .dial-label .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: #fff;
        }

        /* Right Side: Central Display */
        .main-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid var(--border);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .drive-unit {
            text-align: center;
            z-index: 2;
        }

        .drive-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .drive-value {
            font-size: 8rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            line-height: 1;
            background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
        }

        .drive-status {
            margin-top: 20px;
            padding: 8px 24px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-cyan);
            border-radius: 100px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-cyan);
            box-shadow: var(--neon-glow);
        }

        /* Abstract Signal background */
        .signal-viz {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: 1;
        }

        .signal-viz path {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 1;
        }

        /* Decorative Elements */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>

<body>
    <div class="cockpit">
        <div class="grid-lines"></div>
        <div class="header">
            <div class="status-dot"></div>
            <h1>Grep-EQ-Spectrum Analyzer</h1>
        </div>

        <div class="controls">
            <div class="dial-container">
                <div class="dial">
                    <svg width="80" height="80">
                        <circle class="bg" cx="40" cy="40" r="36"></circle>
                        <circle class="progress" id="v-dial" cx="40" cy="40" r="36" style="stroke-dashoffset: 137.86;">
                        </circle> <!-- (1 - 0.39) * 226 -->
                    </svg>
                </div>
                <div class="dial-label">
                    <span class="name">Valence</span>
                    <span class="value">0.39</span>
                </div>
            </div>

            <div class="dial-container">
                <div class="dial">
                    <svg width="80" height="80">
                        <circle class="bg" cx="40" cy="40" r="36"></circle>
                        <circle class="progress" id="a-dial" cx="40" cy="40" r="36" style="stroke-dashoffset: 58.76;">
                        </circle> <!-- (1 - 0.74) * 226 -->
                    </svg>
                </div>
                <div class="dial-label">
                    <span class="name">Arousal</span>
                    <span class="value">0.74</span>
                </div>
            </div>

            <div class="dial-container">
                <div class="dial">
                    <svg width="80" height="80">
                        <circle class="bg" cx="40" cy="40" r="36"></circle>
                        <circle class="progress" id="d-dial" cx="40" cy="40" r="36" style="stroke-dashoffset: 144.64;">
                        </circle> <!-- (1 - 0.36) * 226 -->
                    </svg>
                </div>
                <div class="dial-label">
                    <span class="name">Depth</span>
                    <span class="value">0.36</span>
                </div>
            </div>
        </div>

        <div class="main-display">
            <svg class="signal-viz" viewBox="0 0 600 300">
                <path d="M0,150 Q50,100 100,150 T200,150 T300,150 T400,150 T500,150 T600,150" id="wave">
                    <animate attributeName="d" values="M0,150 Q50,100 100,150 T200,150 T300,150 T400,150 T500,150 T600,150;
                                M0,150 Q50,200 100,150 T200,150 T300,150 T400,150 T500,150 T600,150;
                                M0,150 Q50,100 100,150 T200,150 T300,150 T400,150 T500,150 T600,150" dur="2s"
                        repeatCount="indefinite" />
                </path>
            </svg>
            <div class="drive-unit">
                <div class="drive-label">Current Drive</div>
                <div class="drive-value">0.104</div>
                <div class="drive-status">Focused Work State</div>
            </div>
        </div>

        <div class="footer">
            7th Generation Emotionally-Aware Engine [Alpha 1.0.0]
        </div>
    </div>
</body>

</html>
