name: Light of the Seven - Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - "light_of_the_seven/docs/**"
      - "light_of_the_seven/README.md"
      - ".github/workflows/light-of-the-seven-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "light_of_the_seven/docs/**"
      - "light_of_the_seven/README.md"
      - ".github/workflows/light-of-the-seven-docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./light_of_the_seven

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build documentation
        run: |
          cd docs
          make clean html
        continue-on-error: true

      - name: Check documentation for broken links (optional)
        run: |
          echo "Documentation built successfully"
        continue-on-error: true
