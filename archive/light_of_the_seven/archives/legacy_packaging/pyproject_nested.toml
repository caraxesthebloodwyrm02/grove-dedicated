[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-of-the-seven"
version = "2.0.0"
description = "A computational garden exploring theory, cognitive architecture, AI, and hardware"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "GRID Research Team", email = "research@example.com"}
]
keywords = ["computation", "cognitive-architecture", "ai", "hardware", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education",
]

dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
ibm = [
    "ibm-watsonx-ai>=0.0.1",
]
cuda = [
    "cupy>=10.0.0",
]
torch = [
    "torch>=1.9.0",
]
tensorflow = [
    "tensorflow>=2.10.0",
]
all = [
    "ibm-watsonx-ai>=0.0.1",
    "cupy>=10.0.0",
    "torch>=1.9.0",
    "tensorflow>=2.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.0.240",
    "isort>=5.0.0",
    "mypy>=0.950",
    "pyright>=1.1.200",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/irfankabir02/light-of-the-seven"
Documentation = "https://light-of-the-seven.readthedocs.io"
Repository = "https://github.com/irfankabir02/light-of-the-seven"
Issues = "https://github.com/irfankabir02/light-of-the-seven/issues"

[project.scripts]
light-of-seven = "light_of_the_seven.cli:main"

[tool.setuptools]
packages = ["light_of_the_seven", "cognitive_layer"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "basic"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (slower)",
    "slow: Slow tests",
    "geometry: Geometry module tests",
    "sorting: Sorting algorithm tests",
]

[tool.coverage.run]
source = ["src/light_of_the_seven"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "@overload",
]

